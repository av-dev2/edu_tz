exclude: "^(node_modules|frappe-semgrep-rules)/"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: end-of-file-fixer
        exclude: ".*json$|.*csv"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: "ruff lint"
        args: ["--fix"]
      - id: ruff-format
        name: "ruff format"

  - repo: local
    hooks:
      - id: frappe-semgrep
        name: semgrep (frappe rules)
        entry: bash -c 'if [ ! -d frappe-semgrep-rules/.git ]; then rm -rf frappe-semgrep-rules && GIT_TEMPLATE_DIR="" git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules; fi && semgrep scan --config ./frappe-semgrep-rules/rules --error --skip-unknown-extensions --quiet "$@"' --
        language: python
        additional_dependencies: ["semgrep"]
        types_or: [python, javascript]
        files: "^edu_tz/"
        pass_filenames: true
        require_serial: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, chore, docs, style, test, ci, perf, build, revert]
